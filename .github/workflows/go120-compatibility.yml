name: Go 1.20 Compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - Alpha
      - validation/go120-compatibility
  pull_request:
    branches:
      - Alpha

permissions:
  contents: read

concurrency:
  group: go120-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  linux:
    name: Linux amd64 / Go 1.20
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.20.14"
      - name: Verify toolchain and dependency graph
        run: |
          go version
          go env
          go list -m -f '{{.Path}} {{.GoVersion}}' all > "$RUNNER_TEMP/go120-modules.txt"
          awk '
            NF >= 2 && $2 != "" {
              split($2, version, ".")
              if (version[1] > 1 || (version[1] == 1 && version[2] > 20)) {
                print "dependency requires Go newer than 1.20: " $0
                failed = 1
              }
            }
            END { exit failed }
          ' "$RUNNER_TEMP/go120-modules.txt"
          go mod download all
          go mod verify
      - name: Test default build
        run: go test ./... -count=1
      - name: Test with_gvisor
        run: go test -tags with_gvisor ./... -count=1
      - name: Build default packages
        run: go build ./...

  linux-quickjs-cgo:
    name: Linux amd64 / Go 1.20 / QuickJS CGO
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"
      CC: gcc
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.20.14"
      - name: Verify native C toolchain
        run: |
          go version
          test "$(go env CGO_ENABLED)" = "1"
          test "$(gcc -dumpmachine)" = "x86_64-linux-gnu"
      - name: Test QuickJS package
        run: go test -tags quickjs ./component/quickjs -count=1
      - name: Build all packages with QuickJS
        run: go build -tags quickjs ./...

  linux-quickjs-stub:
    name: Linux amd64 / Go 1.20 / QuickJS Stub
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.20.14"
      - name: Test QuickJS Stub package
        run: go test -tags quickjs ./component/quickjs -count=1
      - name: Build all packages with QuickJS Stub
        run: go build -tags quickjs ./...

  windows:
    name: Windows amd64 / Go 1.20
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.20.14"
      - name: Verify toolchain and build
        run: |
          go version
          test "$(go env GOOS)" = "windows"
          test "$(go env GOARCH)" = "amd64"
          go build ./...

  windows-quickjs-cgo:
    name: Windows amd64 / Go 1.20 / QuickJS CGO
    runs-on: windows-2025
    env:
      CGO_ENABLED: "1"
      CC: gcc
      MSYS_NO_PATHCONV: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.20.14"
      - name: Verify native Windows C toolchain
        run: |
          go version
          test "$(go env GOOS)" = "windows"
          test "$(go env GOARCH)" = "amd64"
          test "$(go env CGO_ENABLED)" = "1"
          target="$(gcc -dumpmachine)"
          [[ "$target" == x86_64-w64-mingw32* ]]
      - name: Test QuickJS package
        run: go test -tags quickjs ./component/quickjs -count=1
      - name: Build all packages with QuickJS
        run: go build -tags quickjs ./...

  macos:
    name: macOS ${{ matrix.arch }} / Go 1.20
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: amd64
          - runner: macos-latest
            arch: arm64
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.20.14"
      - name: Verify toolchain and build
        run: |
          go version
          test "$(go env GOOS)" = "darwin"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
          go build ./...

  linux-race:
    name: Linux amd64 / Go 1.20 / Race
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.20.14"
      - name: Run concurrency tests with the race detector
        run: go test -race ./common/contextutils ./component/mitm/scriptapi -count=1

  linux-mitm-repeat:
    name: Linux amd64 / Go 1.20 / MITM repeat / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - profile: default x50
            tags: ""
            cgo: "0"
            race: "false"
          - profile: with_gvisor x50
            tags: with_gvisor
            cgo: "0"
            race: "false"
          - profile: default Race x50
            tags: ""
            cgo: "1"
            race: "true"
          - profile: with_gvisor Race x50
            tags: with_gvisor
            cgo: "1"
            race: "true"
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      CC: gcc
      MITM_TEST_TAGS: ${{ matrix.tags }}
      MITM_TEST_RACE: ${{ matrix.race }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.20.14"
      - name: Verify Go 1.20.14 toolchain
        run: |
          go version
          test "$(go version)" = "go version go1.20.14 linux/amd64"
          test "$(go env CGO_ENABLED)" = "$CGO_ENABLED"
      - name: Repeat focused MITM test 50 times
        shell: bash
        run: |
          args=()
          if [[ "$MITM_TEST_RACE" == "true" ]]; then
            args+=(-race)
          fi
          if [[ -n "$MITM_TEST_TAGS" ]]; then
            args+=(-tags "$MITM_TEST_TAGS")
          fi
          args+=(-run '^TestM2LargeBodyReplacementClosesConnectionAfterResponse$' -count=50 -v ./component/mitm)

          set +e
          go test "${args[@]}" > "$RUNNER_TEMP/mitm-repeat.log" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/mitm-repeat.log"

          set +e
          python3 - "$RUNNER_TEMP/mitm-repeat.log" <<'PY'
          from pathlib import Path
          import sys

          target = "TestM2LargeBodyReplacementClosesConnectionAfterResponse"
          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          passed = sum(line.startswith(f"--- PASS: {target} ") for line in lines)
          failed = sum(line.startswith(f"--- FAIL: {target} ") for line in lines)
          diagnostics = [line for line in lines if "M2_DIAG" in line]
          print(f"M2_REPEAT_SUMMARY: PASS={passed} FAIL={failed} DIAGNOSTICS={len(diagnostics)} TOTAL={passed + failed} EXPECTED=50")
          details = [
              line for line in lines
              if any(marker in line for marker in (
                  "M2_DIAG", "http_m2_test.go:", "broken pipe", "Error Trace:", "Error:",
                  "panic:", "fatal error:", "unexpected EOF",
              ))
          ]
          for line in details:
              print(f"M2_DETAIL: {line}")
          if passed + failed != 50 or len(diagnostics) != 50:
              print("REPEAT_COUNT_MISMATCH: test output did not report all 50 iterations")
              sys.exit(2)
          PY
          parser_status=$?
          set -e
          if [[ "$parser_status" -ne 0 ]]; then
            exit "$parser_status"
          fi
          exit "$test_status"

  linux-mitm-timeout-repeat:
    if: github.ref == 'refs/heads/validation/go120-compatibility'
    name: Linux amd64 / Go 1.20.14 / MITM timeout repeat / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - profile: default x50
            tags: ""
            cgo: "0"
            race: "false"
            count: "50"
          - profile: with_gvisor x50
            tags: with_gvisor
            cgo: "0"
            race: "false"
            count: "50"
          - profile: default Race x10
            tags: ""
            cgo: "1"
            race: "true"
            count: "10"
          - profile: with_gvisor Race x10
            tags: with_gvisor
            cgo: "1"
            race: "true"
            count: "10"
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      CC: gcc
      MITM_TIMEOUT_TEST_TAGS: ${{ matrix.tags }}
      MITM_TIMEOUT_TEST_RACE: ${{ matrix.race }}
      MITM_TIMEOUT_TEST_COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.20.14"
      - name: Verify Go 1.20.14 toolchain
        run: |
          go version
          test "$(go version)" = "go version go1.20.14 linux/amd64"
          test "$(go env CGO_ENABLED)" = "$CGO_ENABLED"
      - name: Repeat focused MITM timeout regressions
        shell: bash
        run: |
          test_pattern='^(TestM2Go120ResponseHeaderTimeoutErrorCompatibility|TestM2ResponseHeaderTimeoutIsClassifiedAsGatewayTimeout|TestM2ResponseHeaderTimeoutReturns504ThroughProductionErrorHandler|TestM2RequestContextDeadlineRemainsGatewayTimeout|TestM2ActiveUpstreamRequestCancellationIsNotGatewayTimeout|TestM2OrdinaryUpstreamErrorsAreNotGatewayTimeouts|TestM2RequestTimeoutAndAbnormalUpstreamDisconnect|TestM2ClientCancellationClosesRewrittenUpstreamConnection)$'
          args=(-json -count "$MITM_TIMEOUT_TEST_COUNT" -run "$test_pattern")
          if [[ "$MITM_TIMEOUT_TEST_RACE" == "true" ]]; then
            args+=(-race)
          fi
          if [[ -n "$MITM_TIMEOUT_TEST_TAGS" ]]; then
            args+=(-tags "$MITM_TIMEOUT_TEST_TAGS")
          fi
          args+=(./component/mitm)

          log_file="$RUNNER_TEMP/mitm-timeout-repeat.jsonl"
          set +e
          go test "${args[@]}" > "$log_file" 2>&1
          test_status=$?
          set -e
          cat "$log_file"

          set +e
          python3 - "$log_file" "$MITM_TIMEOUT_TEST_COUNT" "$test_status" <<'PY'
          from collections import Counter
          import json
          import re
          import sys
          from pathlib import Path

          log_path = Path(sys.argv[1])
          expected_count = int(sys.argv[2])
          test_status = int(sys.argv[3])
          targets = (
              "TestM2Go120ResponseHeaderTimeoutErrorCompatibility",
              "TestM2ResponseHeaderTimeoutIsClassifiedAsGatewayTimeout",
              "TestM2ResponseHeaderTimeoutReturns504ThroughProductionErrorHandler",
              "TestM2RequestContextDeadlineRemainsGatewayTimeout",
              "TestM2ActiveUpstreamRequestCancellationIsNotGatewayTimeout",
              "TestM2OrdinaryUpstreamErrorsAreNotGatewayTimeouts",
              "TestM2RequestTimeoutAndAbnormalUpstreamDisconnect",
              "TestM2ClientCancellationClosesRewrittenUpstreamConnection",
          )
          expected_status = {
              "go120_error_handler": 504,
              "response_header_handler": 504,
              "request_context_deadline": 504,
              "body_discard_timeout": 504,
              "upstream_request_timeout": 504,
              "connection_refused": 502,
              "abrupt_disconnect": 502,
          }
          expected_cancellations = {
              "concurrent_response_timeout": "committed=false body_bytes=0",
              "active_upstream_roundtrip": "classified_timeout=false",
              "downstream_disconnect": "upstream_closed=true",
          }
          passed = Counter()
          failed = Counter()
          failures = []
          statuses = Counter()
          cancellations = Counter()
          unparsed = []
          status_pattern = re.compile(r"M2_TIMEOUT_STATUS scenario=(\S+) got=(\d+) want=(\d+)")
          for raw in log_path.read_text(errors="replace").splitlines():
              try:
                  event = json.loads(raw)
              except json.JSONDecodeError:
                  if raw.strip():
                      unparsed.append(raw)
                  continue
              name = event.get("Test", "")
              action = event.get("Action")
              if name in targets and action == "pass":
                  passed[name] += 1
              elif name in targets and action == "fail":
                  failed[name] += 1
                  failures.append(name)
              elif action == "fail" and name.startswith("TestM2"):
                  failures.append(name)
              if action == "output":
                  output = event.get("Output", "")
                  status_match = status_pattern.search(output)
                  if status_match:
                      scenario, got, want = status_match.groups()
                      statuses[(scenario, int(got), int(want))] += 1
                  for scenario, expected in expected_cancellations.items():
                      if f"M2_TIMEOUT_CANCEL scenario={scenario} {expected}" in output:
                          cancellations[scenario] += 1

          print(f"MITM_TIMEOUT_REPEAT_SUMMARY: EXPECTED_PER_TEST={expected_count} TEST_EXIT={test_status}")
          for target in targets:
              print(f"MITM_TIMEOUT_TEST: {target} PASS={passed[target]} FAIL={failed[target]} TOTAL={passed[target] + failed[target]}")
          for scenario, want in expected_status.items():
              total = sum(count for (name, _, _), count in statuses.items() if name == scenario)
              passed_status = sum(count for (name, got, expected), count in statuses.items() if name == scenario and got == expected == want)
              print(f"MITM_TIMEOUT_STATUS: {scenario} EXPECTED={want} PASS={passed_status} TOTAL={total}")
          for scenario in expected_cancellations:
              print(f"MITM_TIMEOUT_CANCEL: {scenario} PASS={cancellations[scenario]} EXPECTED={expected_count}")
          for name in sorted(set(failures)):
              print(f"MITM_TIMEOUT_FAILURE: {name}")
          for line in unparsed:
              print(f"MITM_TIMEOUT_UNPARSED_LOG: {line}")

          missing_tests = [name for name in targets if passed[name] + failed[name] != expected_count]
          missing_status = [name for name in expected_status if sum(count for (scenario, _, _), count in statuses.items() if scenario == name) != expected_count]
          bad_status = [name for name, want in expected_status.items() if sum(count for (scenario, got, expected), count in statuses.items() if scenario == name and got == expected == want) != expected_count]
          missing_cancel = [name for name in expected_cancellations if cancellations[name] != expected_count]
          if missing_tests or missing_status or bad_status or missing_cancel or failures:
              print(f"MITM_TIMEOUT_VALIDATION_ERROR: missing_tests={missing_tests} missing_status={missing_status} bad_status={bad_status} missing_cancel={missing_cancel}")
              sys.exit(2)
          if test_status:
              sys.exit(test_status)
          PY
          parser_status=$?
          set -e
          if [[ "$parser_status" -ne 0 ]]; then
            exit "$parser_status"
          fi
          exit "$test_status"
      - name: Upload timeout regression log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mitm-timeout-repeat-${{ matrix.profile }}
          path: ${{ runner.temp }}/mitm-timeout-repeat.jsonl
          if-no-files-found: error
          retention-days: 14

  linux-m1-repeat:
    name: Linux amd64 / Go 1.20 / M1 repeat / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - profile: default x50
            tags: ""
            cgo: "0"
            race: "false"
          - profile: with_gvisor x50
            tags: with_gvisor
            cgo: "0"
            race: "false"
          - profile: default Race x50
            tags: ""
            cgo: "1"
            race: "true"
          - profile: with_gvisor Race x50
            tags: with_gvisor
            cgo: "1"
            race: "true"
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      CC: gcc
      M1_TEST_TAGS: ${{ matrix.tags }}
      M1_TEST_RACE: ${{ matrix.race }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.20.14"
      - name: Verify Go 1.20.14 toolchain
        run: |
          go version
          test "$(go version)" = "go version go1.20.14 linux/amd64"
          test "$(go env CGO_ENABLED)" = "$CGO_ENABLED"
      - name: Repeat focused M1 cancellation test 50 times
        shell: bash
        run: |
          args=()
          if [[ "$M1_TEST_RACE" == "true" ]]; then
            args+=(-race)
          fi
          if [[ -n "$M1_TEST_TAGS" ]]; then
            args+=(-tags "$M1_TEST_TAGS")
          fi
          args+=(-run '^TestMITMDialEarlyTLSRetryCancellationDoesNotRedial$' -count=50 -v ./tunnel)

          set +e
          go test "${args[@]}" > "$RUNNER_TEMP/m1-repeat.log" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/m1-repeat.log"

          set +e
          python3 - "$RUNNER_TEMP/m1-repeat.log" <<'PY'
          from pathlib import Path
          import re
          import sys

          target = "TestMITMDialEarlyTLSRetryCancellationDoesNotRedial"
          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          passed = sum(line.startswith(f"--- PASS: {target} ") for line in lines)
          failed = sum(line.startswith(f"--- FAIL: {target} ") for line in lines)
          diagnostics = [line for line in lines if "M1_DIAG" in line]
          calls = [int(match.group(1)) for line in diagnostics if (match := re.search(r"proxy_calls=(\d+)", line))]
          returned_errors = [line.split(" returned_err=", 1)[1].split(" proxy_calls=", 1)[0] for line in diagnostics if " returned_err=" in line]
          injected_error = sum("injected EarlyConn ClientHello write failure" in error for error in returned_errors)
          canceled_error = sum("context canceled" in error for error in returned_errors)
          other_error = len(returned_errors) - injected_error - canceled_error
          multiple_calls = sum(value > 1 for value in calls)
          print(
              "M1_REPEAT_SUMMARY: "
              f"PASS={passed} FAIL={failed} DIAGNOSTICS={len(diagnostics)} "
              f"RETURNED_INJECTED_WRITE_ERROR={injected_error} RETURNED_CONTEXT_CANCELED={canceled_error} "
              f"RETURNED_OTHER_ERROR={other_error} "
              f"PROXY_CALLS_GT1={multiple_calls} "
              "EXPECTED=50"
          )
          details = [line for line in lines if any(marker in line for marker in (
              "M1_DIAG", "mitm_m1_test.go:", "injected EarlyConn", "context canceled",
              "panic:", "fatal error:",
          ))]
          for line in details:
              print(f"M1_DETAIL: {line}")
          if passed + failed != 50 or len(diagnostics) != 50 or len(calls) != 50:
              print("M1_COUNT_MISMATCH: expected 50 test results and 50 diagnostics")
              sys.exit(2)
          if multiple_calls:
              print("M1_UNEXPECTED_RETRY: proxy DialContext was invoked more than once after cancellation")
              sys.exit(1)
          PY
          parser_status=$?
          set -e
          if [[ "$parser_status" -ne 0 ]]; then
            exit "$parser_status"
          fi
          exit "$test_status"
